<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gisborne Dive Conditions</title>
<style>
  :root {
    --bg: #1c2b3a;
    --card: #263d52;
    --card-border: #4a6885;
    --text: #f2f7fb;
    --muted: #a8c0d4;
    --good: #29c46a;
    --bad: #e5484d;
    --accent: #29b6f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  .days { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 24px; }
  @media (min-width: 800px) {
    .days { grid-template-columns: repeat(4, 1fr); }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 18px;
  }
  .card-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card h2 { margin: 0; font-size: 1.05rem; }
  .card .date { color: var(--muted); font-size: 0.8rem; margin-bottom: 12px; }
  .verdict {
    display: inline-block;
    flex: 0 0 auto;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 4px 12px;
    border-radius: 999px;
  }
  .verdict.dive { background: rgba(41,196,106,0.15); color: var(--good); }
  .verdict.no-dive { background: rgba(229,72,77,0.15); color: var(--bad); }
  .score-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .score-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--card-border); overflow: hidden; }
  .score-bar > div { height: 100%; border-radius: 3px; }
  .score-label { font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
  .rule { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 4px 0; border-top: 1px solid var(--card-border); }
  .rule:first-of-type { border-top: none; }
  .rule .label { color: var(--muted); }
  .rule .pass { color: var(--good); }
  .rule .fail { color: var(--bad); }
  .wind-chips { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .chip { font-size: 0.7rem; padding: 2px 6px; border-radius: 6px; background: var(--card-border); }
  .chip.ok { background: rgba(41,196,106,0.2); color: var(--good); }
  .chip.no { background: rgba(229,72,77,0.2); color: var(--bad); }
  details {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 16px;
  }
  summary { cursor: pointer; font-weight: 600; }
  details ul { margin: 10px 0 0; padding-left: 20px; color: var(--muted); font-size: 0.85rem; line-height: 1.6; }
  #status { color: var(--muted); font-size: 0.9rem; }
  a { color: var(--accent); }
  .history {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 14px 18px 18px;
    margin-bottom: 16px;
  }
  .history h2 { margin: 0 0 2px; font-size: 1.05rem; }
  .history-range { color: var(--muted); font-size: 0.8rem; text-align: center; margin-bottom: 10px; }
  .history-row { display: flex; align-items: stretch; gap: 8px; }
  .hist-btn {
    flex: 0 0 auto;
    width: 34px;
    border: none;
    border-radius: 8px;
    background: var(--card-border);
    color: var(--text);
    font-size: 1.2rem;
    line-height: 1;
    cursor: pointer;
    user-select: none;
    touch-action: none;
  }
  .hist-btn:active { background: var(--accent); }
  .hist-btn:disabled { opacity: 0.3; cursor: default; background: var(--card-border); }
  .history-chart-wrap { flex: 1; min-width: 0; }
  .history-chart { display: flex; align-items: flex-end; height: 100px; gap: 2px; }
  .hist-bar-col { position: relative; flex: 1; min-width: 0; height: 100%; display: flex; align-items: flex-end; }
  .hist-bar { width: 100%; border-radius: 2px 2px 0 0; min-height: 2px; }
  .hist-dive-dot {
    position: absolute;
    left: 50%;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--good);
    transform: translate(-50%, -8px);
  }
  .history-labels { display: flex; gap: 2px; margin-top: 4px; }
  .hist-label-col { flex: 1; min-width: 0; font-size: 0.6rem; color: var(--muted); text-align: center; white-space: nowrap; overflow: visible; position: relative; }
  .tide-list { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .tide-chip { font-size: 0.7rem; padding: 2px 6px; border-radius: 6px; background: var(--card-border); }
  .tide-chip.high { color: #6fb3ff; }
  .tide-chip.low { color: #f0b955; }
  .period-list { display: flex; gap: 4px; margin-top: 4px; }
  .period-chip { flex: 1; border-radius: 6px; padding: 4px 6px; text-align: center; background: var(--card-border); }
  .period-chip .period-label { font-size: 0.65rem; color: var(--muted); display: block; }
  .period-chip .period-swell { font-size: 0.75rem; font-weight: 600; display: block; }
  .info-section-title { margin: 14px 0 4px; font-weight: 600; color: var(--text); }
  .info-section-title:first-child { margin-top: 0; }
  .version { text-align: center; color: var(--muted); font-size: 0.75rem; margin-top: 8px; }
  .loc-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .loc-tab {
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .loc-tab.active { background: var(--accent); border-color: var(--accent); color: #0b1220; }
  .hist-btn.hist-btn-month { font-size: 0.95rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Dive Conditions</h1>
  <div class="loc-tabs" id="locTabs"></div>
  <div class="sub" id="subLine">Loading&hellip;</div>
  <div id="status">Loading live conditions&hellip;</div>
  <div class="days" id="days" style="display:none;"></div>

  <div class="history">
    <h2>Suitability history</h2>
    <div class="history-range" id="historyRange">Loading history&hellip;</div>
    <div class="history-row">
      <button class="hist-btn hist-btn-month" id="histLeftMonth" aria-label="Jump back a month" disabled>&laquo;</button>
      <button class="hist-btn" id="histLeft" aria-label="Scroll earlier" disabled>&lsaquo;</button>
      <div class="history-chart-wrap">
        <div class="history-chart" id="historyChart"></div>
        <div class="history-labels" id="historyLabels"></div>
      </div>
      <button class="hist-btn" id="histRight" aria-label="Scroll later" disabled>&rsaquo;</button>
      <button class="hist-btn hist-btn-month" id="histRightMonth" aria-label="Jump forward a month" disabled>&raquo;</button>
    </div>
  </div>

  <details>
    <summary>Info</summary>

    <p class="info-section-title">Rule for <span id="infoLocName"></span></p>
    <ul id="ruleList"></ul>
  </details>

  <div class="version" id="version"></div>
</div>

<script>
const APP_VERSION = "1.16";
document.getElementById("version").textContent = `v${APP_VERSION}`;

// Each location's rule is either the user's own calibrated rule (Gisborne,

// the same period. See each location's "notes" and the Info panel.

    ],

    ],
  },

    name: "Makorori", lat: -38.65, lon: 178.13,
    rule: {
      swell: { type: "directional", southM: 1.2, northM: 2.0 },
      wind: { enabled: true, requiredDays: 4, windowDays: 5 },
      rain: { enabled: true, maxMm: 30, windowDays: 7 },
    },
    ruleText: [
      "Swell threshold scales smoothly from 1.2 m (from due south) to 2.0 m (from due north), based on swell direction.",
      "Wind predominantly NW&rarr;N&rarr;NE for at least 4 of the last 5 days.",
      "Less than 30 mm of rain in the trailing 7 days.",
    ],
    notes: [
      "Uses the same rule as Gisborne/Wainui &mdash; it's your rule, not something re-derived for this specific spot &mdash; evaluated at Makorori's own coordinates, which fall in a genuinely different, more exposed Open-Meteo grid cell (confirmed: Makorori reads noticeably higher swell than Gisborne town on the same day).",

    ],
  },
  goatisland: {
    name: "Goat Island", lat: -36.2661, lon: 174.7860,
    rule: {
      swell: { type: "flat", maxM: 0.6 },
      wind: { enabled: true, requiredDays: 3, windowDays: 5, centerDeg: 225, halfWidthDeg: 67.5 },

    },

    ],
  },

    rule: {
      swell: { type: "flat", maxM: 1.6 },
      wind: { enabled: false },
      rain: { enabled: true, maxMm: 15, windowDays: 7 },

  },
  wellington: {
    name: "Wellington (Taputeranga)", lat: -41.3592, lon: 174.7670,
    rule: {

      rain: { enabled: true, maxMm: 25, windowDays: 7 },

      "Swell under about 1.4 m.",
      "Wind predominantly NW&rarr;N&rarr;NE for at least 3 of the last 5 days.",

    name: "Porirua", lat: -41.10, lon: 174.83,

    ],
  },
  bayofislands: {
    name: "Bay of Islands", lat: -35.19, lon: 174.30,

    },

      "Also found via the national grid scan (see Porirua) &mdash; the second-highest-ranked uncovered cell in the country, but with a notably smaller sample: only 28 days had one observer photograph 3+ species, versus 45-125 at the other derived sites. Treat this rule as more tentative than the others.",

  },
  kapiti: {
    name: "Kapiti", lat: -40.88, lon: 174.92,

      rain: { enabled: false },
    },
    ruleText: ["Swell under about 0.8 m."],
    notes: [
      "Found via the national grid scan (see Porirua/Bay of Islands), re-derived with the reliable one-observer-3+-species method: 34 confirmed dive days vs 34 random days.",
      "Swell showed the strongest single-factor result of any site checked in this whole project (0.57 m vs 1.07 m average, Cohen's d -1.25 - the two distributions barely overlap). Wind showed only a weak effect and rain none, so neither is included.",
    ],
  },
  torbay: {
    name: "Torbay", lat: -36.70, lon: 174.76,
    rule: {

      rain: { enabled: false },
    },
    ruleText: ["Swell under about 0.25 m."],
    notes: [
      "Also found via the national grid scan, re-derived the same way as Kapiti: 25 confirmed dive days vs 25 random days.",

};

function loadSavedLocation() {
  try {
    const saved = localStorage.getItem("diveLocation");
    if (saved && LOCATIONS[saved]) return saved;
  } catch (e) { /* localStorage unavailable - fall back to default */ }
  return "gisborne";
}

let currentLocKey = loadSavedLocation();

function compass(deg) {
  const dirs = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return dirs[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16];
}

function windArcLabel(rule) {
  const center = rule.wind.centerDeg ?? 0;
  const halfWidth = rule.wind.halfWidthDeg ?? 67.5;
  return `${compass(center - halfWidth)}&ndash;${compass(center)}&ndash;${compass(center + halfWidth)}`;
}

// The "favourable" wind arc is per-location, not fixed - Gisborne/Makorori/
// Wellington all happen to favour NW->N->NE (centered on 0deg/north, 67.5deg
// half-width, i.e. NW through NE), but that's this coast's geometry, not a
// universal rule. A rule can override centerDeg/halfWidthDeg to use a
// different arc entirely.
function isFavourableWindDirFor(rule, deg) {
  const center = rule.wind.centerDeg ?? 0;
  const halfWidth = rule.wind.halfWidthDeg ?? 67.5;
  const d = ((deg % 360) + 360) % 360;
  let diff = Math.abs(d - center);
  if (diff > 180) diff = 360 - diff;
  return diff <= halfWidth;
}

function swellThresholdFor(rule, deg) {
  if (rule.swell.type === "flat") return rule.swell.maxM;
  // Directional type (Gisborne/Makorori): smooth interpolation instead of a hard
  // S/SW/SE-vs-N/NE/NW split - the threshold rises from southM (swell from due
  // south, full impact) to northM (swell from due north, dampened impact), based
  // on angular distance from north. Removes the discontinuity at old arc
  // boundaries and the ad-hoc "due-west" special case - west falls naturally
  // partway between.
  const d = ((deg % 360) + 360) % 360;
  const distFromNorth = Math.min(d, 360 - d); // 0 at north, 180 at south
  const leniencyFrac = 1 - distFromNorth / 180; // 1 at north, 0 at south
  return rule.swell.southM + (rule.swell.northM - rule.swell.southM) * leniencyFrac;
}

// Evaluates one day against a location's rule. windWindow/rainTotal are always
// passed in (harmless if the rule doesn't use them) so callers don't need to
// know which conditions are active before computing them.
function evaluateDay(rule, { sH, sDir, windWindow, rainTotal }) {
  const swellEnabled = rule.swell.enabled !== false; // absent key = enabled, matching existing configs
  const threshold = swellEnabled ? swellThresholdFor(rule, sDir) : null;
  const swellPass = swellEnabled ? (sH != null && sH < threshold) : null;
  const swellScore = swellEnabled ? (sH != null ? clamp01(1 - sH / threshold) * 100 : 0) : null;

  const scores = [];
  let allPass = true;
  if (swellEnabled) {
    scores.push(swellScore);
    allPass = allPass && swellPass;
  }

  let windPass = null, windScore = null, favourableCount = null;
  if (rule.wind.enabled) {
    favourableCount = windWindow.filter(d => isFavourableWindDirFor(rule, d)).length;
    windPass = favourableCount >= rule.wind.requiredDays;
    windScore = (favourableCount / rule.wind.windowDays) * 100;
    scores.push(windScore);
    allPass = allPass && windPass;
  }

  let rainPass = null, rainScore = null;
  if (rule.rain.enabled) {
    rainPass = rainTotal < rule.rain.maxMm;
    rainScore = clamp01(1 - rainTotal / rule.rain.maxMm) * 100;
    scores.push(rainScore);
    allPass = allPass && rainPass;
  }

  const overallScore = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);

  return { threshold, swellPass, swellScore, windPass, windScore, favourableCount, rainPass, rainScore, allPass, overallScore };
}

function clamp01(x) {
  return Math.max(0, Math.min(1, x));
}

function scoreLabel(score) {
  if (score >= 80) return "Excellent";
  if (score >= 60) return "Good";
  if (score >= 40) return "Marginal";
  return "Poor";
}

function scoreColor(score) {
  if (score >= 80) return "#29c46a";
  if (score >= 60) return "#8bc23c";
  if (score >= 40) return "#e0a52c";
  return "#e5484d";
}

function fmtDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}

function fmtWeekday(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "long" });
}

function dateOf(hourlyIso) {
  return hourlyIso.split("T")[0];
}

function fmtTime(hourlyIso) {
  // Parse the wall-clock hour/minute directly rather than going through Date
  // (which would reinterpret an offset-less timestamp in the viewer's own timezone).
  const [h, m] = hourlyIso.split("T")[1].split(":").map(Number);
  const ampm = h >= 12 ? "pm" : "am";
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2, "0")}${ampm}`;
}

function circularMeanDeg(degrees) {
  const rad = degrees.map(d => (d * Math.PI) / 180);
  const sinSum = rad.reduce((a, r) => a + Math.sin(r), 0);
  const cosSum = rad.reduce((a, r) => a + Math.cos(r), 0);
  const mean = (Math.atan2(sinSum, cosSum) * 180) / Math.PI;
  return ((mean % 360) + 360) % 360;
}

// Fixed clock-hour bands for the intraday swell breakdown. Somewhat arbitrary
// (a diver's own "morning" may differ) - change these if they don't match
// when you'd actually plan a dive.
const DAY_PERIODS = [
  { key: "morning", label: "Morning", hours: [6, 7, 8, 9, 10] },
  { key: "midday", label: "Midday", hours: [11, 12, 13] },
  { key: "afternoon", label: "Afternoon", hours: [14, 15, 16, 17] },
];

function computePeriodSwell(rule, hourlyTimes, heights, dirs, dateStr) {
  return DAY_PERIODS.map(period => {
    const idxs = [];
    hourlyTimes.forEach((t, i) => {
      if (dateOf(t) === dateStr && period.hours.includes(Number(t.split("T")[1].split(":")[0]))) {
        idxs.push(i);
      }
    });
    const hVals = idxs.map(i => heights[i]).filter(v => v != null);
    const dVals = idxs.map(i => dirs[i]).filter(v => v != null);
    if (!hVals.length) return { ...period, height: null, dir: null, score: 0, pass: false, threshold: null };
    const avgHeight = hVals.reduce((a, b) => a + b, 0) / hVals.length;
    const dir = circularMeanDeg(dVals);
    const threshold = swellThresholdFor(rule, dir);
    const pass = avgHeight < threshold;
    const score = clamp01(1 - avgHeight / threshold) * 100;
    return { ...period, height: avgHeight, dir, threshold, pass, score };
  });
}

function findTideExtremes(times, heights) {
  const extremes = [];
  for (let i = 1; i < heights.length - 1; i++) {
    if (heights[i] > heights[i - 1] && heights[i] > heights[i + 1]) {
      extremes.push({ time: times[i], height: heights[i], type: "high" });
    } else if (heights[i] < heights[i - 1] && heights[i] < heights[i + 1]) {
      extremes.push({ time: times[i], height: heights[i], type: "low" });
    }
  }
  return extremes;
}

const FORECAST_DAYS = 4; // today + 3 days ahead

async function loadConditions() {
  const { lat, lon, rule } = LOCATIONS[currentLocKey];
  const marineUrl = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}` +
    `&daily=swell_wave_height_max,swell_wave_direction_dominant` +
    `&hourly=sea_level_height_msl,swell_wave_height,swell_wave_direction` +
    `&timezone=auto&forecast_days=${FORECAST_DAYS}`;
  const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    `&daily=winddirection_10m_dominant,precipitation_sum&timezone=auto&past_days=7&forecast_days=${FORECAST_DAYS}`;

  const [marineRes, weatherRes] = await Promise.all([fetch(marineUrl), fetch(weatherUrl)]);
  if (!marineRes.ok || !weatherRes.ok) throw new Error("Open-Meteo request failed");
  const marine = await marineRes.json();
  const weather = await weatherRes.json();

  const wTime = weather.daily.time;               // 7 past + today + next (FORECAST_DAYS-1)
  const windDir = weather.daily.winddirection_10m_dominant;
  const rain = weather.daily.precipitation_sum;
  const todayIdxInWeather = wTime.length - FORECAST_DAYS; // index of "today" in the weather arrays

  const mTime = marine.daily.time;                 // today .. FORECAST_DAYS-1 days ahead
  const swellH = marine.daily.swell_wave_height_max;
  const swellDir = marine.daily.swell_wave_direction_dominant;

  const tideExtremes = findTideExtremes(marine.hourly.time, marine.hourly.sea_level_height_msl);
  const tidesByDate = {};
  tideExtremes.forEach(e => {
    const d = dateOf(e.time);
    (tidesByDate[d] = tidesByDate[d] || []).push(e);
  });

  const results = [];
  for (let offset = 0; offset < FORECAST_DAYS; offset++) {
    const weatherIdx = todayIdxInWeather + offset;

    // Wind: last N days (per this site's rule) ending on (and including) this day
    const windDays = rule.wind.windowDays || 5;
    const windWindow = [];
    for (let k = weatherIdx - (windDays - 1); k <= weatherIdx; k++) {
      if (k >= 0 && k < windDir.length) windWindow.push(windDir[k]);
    }

    // Rain: 7 days ending on (and including) the day BEFORE this evaluation day
    let rainTotal = 0;
    for (let k = weatherIdx - 7; k <= weatherIdx - 1; k++) {
      if (k >= 0 && k < rain.length && rain[k] != null) rainTotal += rain[k];
    }

    const sH = swellH[offset];
    const sDir = swellDir[offset];

    const evalResult = evaluateDay(rule, { sH, sDir, windWindow, rainTotal });

    const periods = rule.swell.enabled === false ? [] : computePeriodSwell(
      rule, marine.hourly.time, marine.hourly.swell_wave_height, marine.hourly.swell_wave_direction, mTime[offset]
    );

    results.push({
      date: mTime[offset],
      sH, sDir, windWindow, rainTotal,
      ...evalResult,
      tides: tidesByDate[mTime[offset]] || [],
      periods,
    });
  }
  return results;
}

function render(results) {
  const rule = LOCATIONS[currentLocKey].rule;
  const container = document.getElementById("days");
  container.innerHTML = "";
  results.forEach((r, i) => {
    const label = i === 0 ? "Today" : i === 1 ? "Tomorrow" : fmtWeekday(r.date);
    const card = document.createElement("div");
    card.className = "card";

    const swellBlock = rule.swell.enabled !== false ? `
      <div class="rule"><span class="label">Swell</span>
        <span class="${r.swellPass ? 'pass' : 'fail'}">${r.sH != null ? r.sH.toFixed(1) : '?'} m from ${compass(r.sDir)}</span>
      </div>
      <div class="period-list">${r.periods.map(p => `
        <div class="period-chip" title="${p.height != null ? p.height.toFixed(2) + 'm from ' + compass(p.dir) : 'no data'}">
          <span class="period-label">${p.label}</span>
          <span class="period-swell" style="color:${p.height != null ? scoreColor(p.score) : 'var(--muted)'};">${p.height != null ? p.height.toFixed(1) + 'm' : '?'}</span>
        </div>
      `).join('')}</div>
    ` : '';

    const windBlock = rule.wind.enabled ? `
      <div class="rule"><span class="label">Wind (${rule.wind.windowDays}d)</span>
        <span class="${r.windPass ? 'pass' : 'fail'}">${r.favourableCount}/${rule.wind.windowDays} days ${windArcLabel(rule)}</span>
      </div>
      <div class="wind-chips">${r.windWindow.map(d => {
        const ok = isFavourableWindDirFor(rule, d);
        return `<span class="chip ${ok ? 'ok' : 'no'}">${compass(d)}</span>`;
      }).join('')}</div>
    ` : '';

    const rainBlock = rule.rain.enabled ? `
      <div class="rule"><span class="label">Rain (${rule.rain.windowDays}d trailing)</span>
        <span class="${r.rainPass ? 'pass' : 'fail'}">${r.rainTotal.toFixed(1)} mm</span>
      </div>
    ` : '';

    card.innerHTML = `
      <div class="card-header">
        <h2>${label}</h2>
        <div class="verdict ${r.allPass ? 'dive' : 'no-dive'}">${r.allPass ? 'DIVE' : 'NO DIVE'}</div>
      </div>
      <div class="date">${fmtDate(r.date)}</div>
      <div class="score-row">
        <div class="score-bar"><div style="width:${r.overallScore}%; background:${scoreColor(r.overallScore)};"></div></div>
        <span class="score-label" style="color:${scoreColor(r.overallScore)};">${r.overallScore} &middot; ${scoreLabel(r.overallScore)}</span>
      </div>
      ${swellBlock}
      ${windBlock}
      ${rainBlock}
      <div class="rule"><span class="label">Tides</span></div>
      <div class="tide-list">${r.tides.map(t => `<span class="tide-chip ${t.type}">${t.type === 'high' ? 'High' : 'Low'} ${fmtTime(t.time)} (${t.height.toFixed(2)}m)</span>`).join('') || '<span class="tide-chip">No tide data</span>'}</div>
    `;
    container.appendChild(card);
  });
  container.style.display = "grid";
  document.getElementById("status").style.display = "none";
}

// --- Suitability history chart ---

// Open-Meteo's marine archive for this coast only has swell data from ~Oct 2021
// onward (verified against the live API - earlier dates return null), so the
// history chart is anchored there rather than a rolling "N years back" window.
const HIST_START_DATE = "2021-09-24"; // 7-day buffer before swell data begins (~Oct 1 2021)
const MOBILE_BREAKPOINT = 800; // matches the .days grid breakpoint

function histWindowSize() {
  return window.innerWidth < MOBILE_BREAKPOINT ? 7 : 30;
}

function isoDate(d) {
  return d.toISOString().slice(0, 10);
}

function fmtDateShort(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function fmtDayNum(iso) {
  return String(new Date(iso + "T00:00:00").getDate());
}

function fmtDateLong(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

async function loadHistory() {
  const { lat, lon, rule } = LOCATIONS[currentLocKey];
  const today = new Date();
  const startStr = HIST_START_DATE;
  const endStr = isoDate(today);

  const marineUrl = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}` +
    `&daily=swell_wave_height_max,swell_wave_direction_dominant&timezone=auto` +
    `&start_date=${startStr}&end_date=${endStr}`;
  const weatherUrl = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}` +
    `&daily=winddirection_10m_dominant,precipitation_sum&timezone=auto` +
    `&start_date=${startStr}&end_date=${endStr}`;

  const [marineRes, weatherRes] = await Promise.all([fetch(marineUrl), fetch(weatherUrl)]);
  if (!marineRes.ok || !weatherRes.ok) throw new Error("Historical data request failed");
  const marine = await marineRes.json();
  const weather = await weatherRes.json();

  const time = weather.daily.time;
  const windDir = weather.daily.winddirection_10m_dominant;
  const rain = weather.daily.precipitation_sum;
  const swellH = marine.daily.swell_wave_height_max;
  const swellDir = marine.daily.swell_wave_direction_dominant;

  const windDays = rule.wind.windowDays || 5;
  const history = [];
  for (let i = 7; i < time.length; i++) {
    const sH = swellH[i];
    const sDir = swellDir[i];
    if (sH == null || sDir == null) continue;

    const windWindow = windDir.slice(Math.max(0, i - (windDays - 1)), i + 1);
    if (rule.wind.enabled && windWindow.some(d => d == null)) continue;

    const rainWindow = rain.slice(Math.max(0, i - 7), i);
    if (rule.rain.enabled && rainWindow.some(v => v == null)) continue;
    const rainTotal = rainWindow.reduce((a, b) => a + (b || 0), 0);

    const evalResult = evaluateDay(rule, { sH, sDir, windWindow, rainTotal });

    history.push({
      date: time[i],
      allPass: evalResult.allPass,
      overallScore: evalResult.overallScore,
    });
  }
  return history;
}

let historyData = [];
let dateToIndex = new Map();
let windowEnd = 0; // index into historyData of the last (most recent) visible day

function renderHistoryChart() {
  const windowSize = histWindowSize();
  const start = windowEnd - windowSize + 1;
  const slice = historyData.slice(start, windowEnd + 1);

  const chartEl = document.getElementById("historyChart");
  chartEl.innerHTML = slice.map(d => {
    const color = scoreColor(d.overallScore);
    // Forecast days (not yet confirmed history) get a hashed, translucent fill
    // instead of a solid one, so they read as predicted rather than recorded.
    const barStyle = d.isForecast
      ? `height:${d.overallScore}%; color:${color}; opacity:0.6; background:repeating-linear-gradient(45deg, currentColor 0 3px, transparent 3px 7px);`
      : `height:${d.overallScore}%; background:${color};`;
    return `
      <div class="hist-bar-col" title="${fmtDateLong(d.date)}: ${d.overallScore}/100${d.allPass ? ' (DIVE)' : ''}${d.isForecast ? ' – forecast' : ''}">
        ${d.allPass ? `<div class="hist-dive-dot" style="bottom:${d.overallScore}%;"></div>` : ""}
        <div class="hist-bar" style="${barStyle}"></div>
      </div>
    `;
  }).join("");

  const labelsEl = document.getElementById("historyLabels");
  const labelStep = windowSize <= 10 ? 1 : 5;
  labelsEl.innerHTML = slice.map((d, idx) => {
    const show = idx % labelStep === 0 || idx === slice.length - 1;
    // With every column labeled (narrow/mobile view), a bare day number avoids
    // adjacent labels overlapping - the month is already shown in the range line above.
    const text = labelStep === 1 ? fmtDayNum(d.date) : fmtDateShort(d.date);
    return `<div class="hist-label-col">${show ? text : ""}</div>`;
  }).join("");

  document.getElementById("historyRange").textContent =
    `${fmtDateLong(slice[0].date)} – ${fmtDateLong(slice[slice.length - 1].date)}`;

  const atStart = start <= 0;
  const atEnd = windowEnd >= historyData.length - 1;
  document.getElementById("histLeft").disabled = atStart;
  document.getElementById("histRight").disabled = atEnd;
  document.getElementById("histLeftMonth").disabled = atStart;
  document.getElementById("histRightMonth").disabled = atEnd;
}

function stepHistory(delta) {
  const newEnd = Math.min(historyData.length - 1, Math.max(histWindowSize() - 1, windowEnd + delta));
  if (newEnd === windowEnd) return false;
  windowEnd = newEnd;
  renderHistoryChart();
  return true;
}

function stepHistoryByMonths(delta) {
  const current = new Date(historyData[windowEnd].date + "T00:00:00");
  current.setMonth(current.getMonth() + delta);
  const targetIso = isoDate(current);

  let idx = dateToIndex.get(targetIso);
  if (idx === undefined) {
    // No exact match (shouldn't normally happen on a contiguous daily series) -
    // fall back to an approximate day-count jump in the same direction.
    idx = windowEnd + delta * 30;
  }
  idx = Math.min(historyData.length - 1, Math.max(histWindowSize() - 1, idx));
  if (idx === windowEnd) return false;
  windowEnd = idx;
  renderHistoryChart();
  return true;
}

function setupHoldButton(el, stepFn) {
  let holdTimer = null;
  let active = false;
  let speed = 0;

  function loop() {
    if (!active) return;
    const moved = stepFn();
    if (!moved) { stopHold(); return; }
    speed = Math.max(35, speed * 0.85);
    holdTimer = setTimeout(loop, speed);
  }

  function startHold(e) {
    e.preventDefault();
    if (active) return;
    active = true;
    speed = 300;
    stepFn(); // immediate first step
    holdTimer = setTimeout(loop, 400); // pause before auto-repeat kicks in
  }

  function stopHold() {
    active = false;
    clearTimeout(holdTimer);
    holdTimer = null;
  }

  el.addEventListener("mousedown", startHold);
  el.addEventListener("touchstart", startHold, { passive: false });
  ["mouseup", "mouseleave", "touchend", "touchcancel"].forEach(evt => el.addEventListener(evt, stopHold));
}

// --- Location switching ---

function renderLocTabs() {
  const container = document.getElementById("locTabs");
  container.innerHTML = Object.entries(LOCATIONS).map(([key, loc]) =>
    `<button class="loc-tab${key === currentLocKey ? ' active' : ''}" data-loc="${key}">${loc.name}</button>`
  ).join("");
  container.querySelectorAll(".loc-tab").forEach(btn => {
    btn.addEventListener("click", () => selectLocation(btn.dataset.loc));
  });
}

function selectLocation(key) {
  if (key === currentLocKey) return;
  currentLocKey = key;
  try { localStorage.setItem("diveLocation", key); } catch (e) { /* ignore */ }
  renderLocTabs();
  refreshAll();
}

function ruleSummaryLine(rule) {
  const parts = [];
  if (rule.swell.enabled !== false) parts.push("swell");
  if (rule.wind.enabled) parts.push("wind");
  if (rule.rain.enabled) parts.push("rain");
  if (parts.length === 1) {
    return `Only ${parts[0]} used at this site.`;
  }
  return `All ${parts.length} (${parts.join(", ")}) must pass for "Dive".`;
}

function renderInfoPanel() {
  const loc = LOCATIONS[currentLocKey];
  document.getElementById("infoLocName").textContent = loc.name;
  document.getElementById("ruleList").innerHTML =
    loc.ruleText.map(t => `<li>${t}</li>`).join("") + `<li>${ruleSummaryLine(loc.rule)}</li>`;
}

function refreshAll() {
  const loc = LOCATIONS[currentLocKey];
  document.getElementById("subLine").textContent =
    `${loc.name} (${loc.lat}, ${loc.lon}) · data: Open-Meteo (marine + weather forecast)`;
  renderInfoPanel();

  document.getElementById("status").style.display = "block";
  document.getElementById("status").textContent = "Loading live conditions…";
  document.getElementById("days").style.display = "none";
  const conditionsPromise = loadConditions();
  conditionsPromise
    .then(render)
    .catch(err => {
      document.getElementById("status").textContent = "Couldn't load conditions: " + err.message;
    });

  document.getElementById("historyRange").textContent = "Loading history…";
  loadHistory()
    .then(async history => {
      historyData = history;
      // Extend the timeline with the same forecast days already shown on the
      // day cards (tomorrow onward - today is already covered by history),
      // reusing conditionsPromise rather than fetching again. Rendered
      // separately (hashed) since these are predictions, not confirmed data.
      try {
        const conditions = await conditionsPromise;
        // Check every forecast day by date rather than assuming index 0 ("today")
        // always duplicates history's last entry - the archive API can lag a day
        // behind for the current day, which would otherwise leave a gap.
        const knownDates = new Set(historyData.map(d => d.date));
        conditions.forEach(r => {
          if (!knownDates.has(r.date)) {
            historyData.push({ date: r.date, allPass: r.allPass, overallScore: r.overallScore, isForecast: true });
          }
        });
      } catch (e) { /* forecast unavailable - history still stands on its own */ }
      dateToIndex = new Map(historyData.map((d, i) => [d.date, i]));
      windowEnd = historyData.length - 1;
      renderHistoryChart();
    })
    .catch(err => {
      document.getElementById("historyRange").textContent = "Couldn't load history: " + err.message;
    });
}

renderLocTabs();
refreshAll();
setupHoldButton(document.getElementById("histLeft"), () => stepHistory(-1));
setupHoldButton(document.getElementById("histRight"), () => stepHistory(1));
setupHoldButton(document.getElementById("histLeftMonth"), () => stepHistoryByMonths(-1));
setupHoldButton(document.getElementById("histRightMonth"), () => stepHistoryByMonths(1));

// Re-render the history chart if the viewport crosses the mobile breakpoint
// (e.g. rotating a phone), since the window size (7 vs 30 days) depends on it.
let lastHistWindowSize = null;
window.addEventListener("resize", () => {
  if (!historyData.length) return;
  const size = histWindowSize();
  if (size === lastHistWindowSize) return;
  lastHistWindowSize = size;
  windowEnd = Math.max(size - 1, Math.min(windowEnd, historyData.length - 1));
  renderHistoryChart();
});
</script>
